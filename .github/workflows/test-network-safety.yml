name: Test network safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile speed_test_and_select.py
      - name: Unit tests (no network changes)
        run: python -m unittest discover -s tests -v
      - name: Reject personal absolute paths
        run: |
          forbidden="C:\\Users\\100""ca"
          if grep -R --line-number --fixed-strings "$forbidden" speed_test_and_select.py tests; then
            echo 'personal absolute path found'
            exit 1
          fi
